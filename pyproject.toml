[project]
name = "fraud-defense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "data/tests", "bench/tests"]
markers = [
    "m01: M1 marketplace and legitimate traffic",
    "m07: M7 held-out attackers",
    "m12: M12 XGBoost voter, baselines and metrics",
]
pythonpath = ["."]
