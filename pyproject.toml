[project]
name = "fraud-defense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "uagents>=0.26.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "engine/tests"]
markers = [
    "m00: M0 foundations",
    "m02: M2 defense skeleton",
]
pythonpath = ["."]
